name: Deploy static preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare preview build
        env:
          EDGE_BASE: ${{ vars.OMNISAVER_EDGE_BASE }}
        run: |
          mkdir -p _site
          cp -r public/. _site/
          # This is a static-only preview (no backend, see README) — keep it
          # out of search results so it doesn't compete with the real domain
          # once one is live.
          sed -i 's#<meta name="robots" content="[^"]*">#<meta name="robots" content="noindex,nofollow">#' _site/index.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          # If the OMNISAVER_EDGE_BASE repo variable is set (Settings →
          # Secrets and variables → Actions → Variables), point the
          # deployed frontend at that Deno Deploy URL so real downloads
          # work. Otherwise stay in "preview banner" mode.
          if [ -n "$EDGE_BASE" ]; then
            printf "window.OMNISAVER_EDGE_BASE = %s;\n" "$(printf '%s' "$EDGE_BASE" | jq -Rs .)" > _site/config.js
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
