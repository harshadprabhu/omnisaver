name: Deploy static preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare preview build
        run: |
          mkdir -p _site
          cp -r public/. _site/
          # This is a static-only preview (no backend, see README) — keep it
          # out of search results so it doesn't compete with the real domain
          # once one is live.
          sed -i 's#<meta name="robots" content="[^"]*">#<meta name="robots" content="noindex,nofollow">#' _site/index.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
